name: Build Windows Installer

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: master
      releaseVersion:
        required: true
        type: string
      artifactArchive:
        required: true
        type: string
      artifactInstaller:
        required: true
        type: string
      lfscache:
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: ${{ !inputs.lfscache }}
          submodules: 'recursive'
          ref: ${{ inputs.branch }}
      
      - name: Create LFS file hash list
        if: ${{ inputs.lfscache }}
        shell: pwsh
        run: git lfs ls-files -l | ForEach-Object { ($_ -split ' ')[0] } | Sort-Object | Set-Content -Path .lfs-objects-id

      - name: Restore LFS Cache
        uses: actions/cache@v5
        id: lfs-cache
        if: ${{ inputs.lfscache }}
        with:
          path: .git/lfs
          key: lfs-cache-${{ hashFiles('.lfs-objects-id') }}

      - name: Git LFS Pull
        if: ${{ inputs.lfscache }}
        shell: pwsh
        run: |
          New-Item -ItemType File -Path lfs.log -Force | Out-Null
          git lfs pull 2>&1 | Tee-Object -FilePath lfs.log
          if (Select-String -Path lfs.log -Pattern 'error:' -Quiet) {
            git lfs logs last
            exit 1
          }
      
      - name: Get Windows Archives
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifactArchive }}
      
      - name: Update ISS files
        shell: pwsh
        working-directory: installer/windows
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          foreach ($name in 'dragengine64', 'dragengine64-sdk', 'deigde64', 'deigde64-sdk') {
            (Get-Content -Raw "$name.iss.in") -replace '%VERSION%', $env:RELEASE_VERSION |
              Set-Content -NoNewline -Path "$name.iss"
          }
      
      - name: Unpack Windows Archives
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          foreach ($archive in 'dragengine', 'dragengine-sdk', 'deigde', 'deigde-sdk') {
            Expand-Archive -Path "$archive-$env:RELEASE_VERSION-windows64.zip" -DestinationPath installer/windows/unpacked -Force
          }
          New-Item -ItemType Directory -Force -Path installer/windows/build | Out-Null
          
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Installers
        shell: pwsh
        working-directory: installer/windows
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          foreach ($script in 'dragengine64.iss', 'dragengine64-sdk.iss', 'deigde64.iss', 'deigde64-sdk.iss') {
            & $iscc $script
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $script" }
          }
      
      - name: Rename installers
        shell: pwsh
        working-directory: installer/windows/build
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          foreach ($name in 'dragengine', 'dragengine-sdk', 'deigde', 'deigde-sdk') {
            Move-Item -Force -Path "install-$name-windows64.exe" -Destination "install-$name-$env:RELEASE_VERSION-windows64.exe"
          }
        
      - name: Store Installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifactInstaller }}
          path: |
            installer/windows/build/install-dragengine-${{ inputs.releaseVersion }}-windows64.exe
            installer/windows/build/install-dragengine-sdk-${{ inputs.releaseVersion }}-windows64.exe
            installer/windows/build/install-deigde-${{ inputs.releaseVersion }}-windows64.exe
            installer/windows/build/install-deigde-sdk-${{ inputs.releaseVersion }}-windows64.exe
          if-no-files-found: error
